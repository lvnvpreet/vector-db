<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template Vector Database Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/react@17.0.2/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.5.1/dist/socket.io.min.js"></script>
  <style>
    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: .5;
      }
    }

    .animate-spin {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .code-block {
      font-family: monospace;
      background: #f5f5f5;
      padding: 1rem;
      border-radius: 0.25rem;
      overflow-x: auto;
    }

    .tag {
      display: inline-block;
      border-radius: 9999px;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      margin-right: 0.25rem;
      margin-bottom: 0.25rem;
    }

    .tag-blue {
      background-color: rgba(96, 165, 250, 0.2);
      color: rgb(30, 64, 175);
    }

    .tag-green {
      background-color: rgba(52, 211, 153, 0.2);
      color: rgb(6, 95, 70);
    }

    .tag-purple {
      background-color: rgba(167, 139, 250, 0.2);
      color: rgb(91, 33, 182);
    }

    .tag-orange {
      background-color: rgba(251, 146, 60, 0.2);
      color: rgb(154, 52, 18);
    }
  </style>
</head>

<body class="bg-gray-50 min-h-screen">
  <div id="app-root">
    <!-- Loading indicator while React loads -->
    <div class="flex justify-center items-center min-h-screen">
      <div class="text-center">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
        <p class="mt-4 text-gray-600">Loading Template Vector Database Generator...</p>
      </div>
    </div>
  </div>

  <script>
    // Initialize Socket.io connection
    const socket = io();
    let socketId = null;

    socket.on('connect', () => {
      console.log('Connected to Socket.io. Socket ID:', socket.id);
      socketId = socket.id;
    });

    // App state
    const appState = {
      files: [],
      uploadProgress: {},
      processingStatus: {},
      activeTab: 'upload',
      processedTemplates: [],
      databaseStats: null,
      searchQuery: '',
      filterType: '',
      filterIndustry: '',
      generatedWebsite: null,
      ragPrompt: '',
      ragComponents: [],
      ragTemplate: null,
      isGenerating: false
    };

    // Main App Component
    function TemplateVectorDBGenerator() {
      const [files, setFiles] = React.useState([]);
      const [uploadProgress, setUploadProgress] = React.useState({});
      const [processingStatus, setProcessingStatus] = React.useState({});
      const [activeTab, setActiveTab] = React.useState('upload');
      const [processedTemplates, setProcessedTemplates] = React.useState([]);
      const [databaseStats, setDatabaseStats] = React.useState(null);
      const [searchQuery, setSearchQuery] = React.useState('');
      const [filterType, setFilterType] = React.useState('');
      const [filterIndustry, setFilterIndustry] = React.useState('');
      const [selectedTemplate, setSelectedTemplate] = React.useState(null);
      const [templateComponents, setTemplateComponents] = React.useState([]);
      const [templateStructure, setTemplateStructure] = React.useState(null);
      const [ragPrompt, setRagPrompt] = React.useState('');
      const [generatedWebsite, setGeneratedWebsite] = React.useState(null);
      const [ragComponents, setRagComponents] = React.useState([]);
      const [ragTemplate, setRagTemplate] = React.useState(null);
      const [isGenerating, setIsGenerating] = React.useState(false);

      React.useEffect(() => {
        // Fetch templates on component mount
        fetchTemplates();
        fetchDatabaseStats();

        // Set up socket listeners
        socket.on('processing-progress', (data) => {
          console.log('Processing progress:', data);
          setUploadProgress(prev => ({
            ...prev,
            [data.fileName]: data.progress
          }));

          setProcessingStatus(prev => ({
            ...prev,
            [data.fileName]: data.status
          }));
        });

        socket.on('processing-complete', (data) => {
          console.log('Processing complete:', data);
          setProcessingStatus(prev => ({
            ...prev,
            [data.fileName]: 'completed'
          }));

          // Refresh templates list after processing
          fetchTemplates();
          fetchDatabaseStats();
        });

        socket.on('processing-error', (data) => {
          console.error('Processing error:', data);
          setProcessingStatus(prev => ({
            ...prev,
            [data.fileName]: 'error'
          }));
        });

        return () => {
          // Clean up socket listeners
          socket.off('processing-progress');
          socket.off('processing-complete');
          socket.off('processing-error');
        };
      }, []);

      const fetchTemplates = async () => {
        try {
          const response = await fetch('/api/templates');
          if (response.ok) {
            const data = await response.json();
            if (data.success) {
              setProcessedTemplates(data.templates);
            }
          }
        } catch (error) {
          console.error('Error fetching templates:', error);
        }
      };

      const fetchDatabaseStats = async () => {
        try {
          const response = await fetch('/api/stats');
          if (response.ok) {
            const data = await response.json();
            if (data.success) {
              setDatabaseStats(data.stats);
            }
          }
        } catch (error) {
          console.error('Error fetching database stats:', error);
        }
      };

      const handleFileChange = (e) => {
        const newFiles = Array.from(e.target.files);
        setFiles(prev => [...prev, ...newFiles]);

        // Initialize progress for each file
        newFiles.forEach(file => {
          setUploadProgress(prev => ({
            ...prev,
            [file.name]: 0
          }));

          setProcessingStatus(prev => ({
            ...prev,
            [file.name]: 'pending'
          }));
        });
      };

      const handleUpload = async () => {
        for (const file of files) {
          try {
            const formData = new FormData();
            formData.append('templateZip', file);
            formData.append('socketId', socketId);

            setUploadProgress(prev => ({
              ...prev,
              [file.name]: 10
            }));

            setProcessingStatus(prev => ({
              ...prev,
              [file.name]: 'uploading'
            }));

            const response = await fetch('/api/upload', {
              method: 'POST',
              body: formData
            });

            if (response.ok) {
              const data = await response.json();
              console.log('Upload successful:', data);

              setUploadProgress(prev => ({
                ...prev,
                [file.name]: 100
              }));

              setProcessingStatus(prev => ({
                ...prev,
                [file.name]: 'extracting'
              }));
            } else {
              throw new Error('Upload failed');
            }
          } catch (error) {
            console.error('Error uploading file:', error);
            setProcessingStatus(prev => ({
              ...prev,
              [file.name]: 'error'
            }));
          }
        }
      };

      const removeFile = (fileName) => {
        setFiles(prev => prev.filter(file => file.name !== fileName));
        setUploadProgress(prev => {
          const newProgress = { ...prev };
          delete newProgress[fileName];
          return newProgress;
        });

        setProcessingStatus(prev => {
          const newStatus = { ...prev };
          delete newStatus[fileName];
          return newStatus;
        });
      };

      const deleteTemplate = async (templateId) => {
        if (!confirm('Are you sure you want to delete this template?')) {
          return;
        }

        try {
          const response = await fetch(`/api/templates/${templateId}`, {
            method: 'DELETE'
          });

          if (response.ok) {
            const data = await response.json();
            if (data.success) {
              // Refresh templates list and stats
              fetchTemplates();
              fetchDatabaseStats();

              // If this was the selected template, clear the selection
              if (selectedTemplate && selectedTemplate._id === templateId) {
                setSelectedTemplate(null);
                setTemplateComponents([]);
                setTemplateStructure(null);
              }
            }
          }
        } catch (error) {
          console.error('Error deleting template:', error);
        }
      };

      const viewTemplateDetails = async (templateId) => {
        try {
          // Fetch template details
          const response = await fetch(`/api/templates/${templateId}`);

          if (response.ok) {
            const data = await response.json();
            if (data.success) {
              setSelectedTemplate(data.template);
              setTemplateComponents(data.components);

              // Fetch template structure if available
              if (data.template.hasStructure) {
                const structureResponse = await fetch(`/api/template-structure/${templateId}`);
                if (structureResponse.ok) {
                  const structureData = await structureResponse.json();
                  if (structureData.success) {
                    setTemplateStructure(structureData.templateStructure);
                  }
                }
              }

              // Switch to template details tab
              setActiveTab('template-details');
            }
          }
        } catch (error) {
          console.error('Error fetching template details:', error);
        }
      };

      const filterTemplates = () => {
        if (!searchQuery && !filterType && !filterIndustry) {
          return processedTemplates;
        }

        return processedTemplates.filter(template => {
          // Filter by search query
          const matchesQuery = !searchQuery ||
            template.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            template.industry.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (template.componentTypes && template.componentTypes.some(type =>
              type.toLowerCase().includes(searchQuery.toLowerCase())
            ));

          // Filter by component type
          const matchesType = !filterType ||
            (template.componentTypes && template.componentTypes.includes(filterType));

          // Filter by industry
          const matchesIndustry = !filterIndustry ||
            template.industry === filterIndustry;

          return matchesQuery && matchesType && matchesIndustry;
        });
      };

      const generateWebsite = async () => {
        if (!ragPrompt.trim()) {
          alert('Please enter a website description first.');
          return;
        }

        setIsGenerating(true);

        try {
          const response = await fetch('/api/rag-website-generation', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              userPrompt: ragPrompt
            })
          });

          if (response.ok) {
            const data = await response.json();
            setGeneratedWebsite(data.generatedWebsite);
            setRagComponents(data.retrievedComponents || []);
            setRagTemplate(data.retrievedTemplate || null);
          } else {
            throw new Error('Website generation failed');
          }
        } catch (error) {
          console.error('Error generating website:', error);
          alert('Failed to generate website. Please try again.');
        } finally {
          setIsGenerating(false);
        }
      };

      const getStatusLabel = (status) => {
        switch (status) {
          case 'pending': return 'Pending';
          case 'uploading': return 'Uploading';
          case 'extracting': return 'Extracting Files';
          case 'analyzing': return 'Analyzing Structure';
          case 'analyzing_structure': return 'Analyzing Structure';
          case 'detecting_structure': return 'Detecting Framework';
          case 'processing_css': return 'Processing CSS';
          case 'processing_images': return 'Processing Images';
          case 'extracting_components': return 'Extracting Components';
          case 'processing_assets': return 'Processing Assets';
          case 'embedding_generation':
          case 'generating_embeddings': return 'Generating Embeddings';
          case 'storing_database': return 'Storing in Database';
          case 'completed': return 'Completed';
          case 'error': return 'Error';
          default: return status;
        }
      };

      const getIndustryOptions = () => {
        const industries = new Set();

        processedTemplates.forEach(template => {
          if (template.industry) {
            industries.add(template.industry);
          }
        });

        return Array.from(industries).sort();
      };

      const getComponentTypeOptions = () => {
        const types = new Set();

        processedTemplates.forEach(template => {
          if (template.componentTypes) {
            template.componentTypes.forEach(type => types.add(type));
          }
        });

        return Array.from(types).sort();
      };

      const renderComponentAttributes = (component) => {
        if (!component.attributes) return null;

        return React.createElement('div', { className: 'mt-2' },
          React.createElement('h4', { className: 'text-sm font-medium text-gray-700' }, 'Attributes:'),
          React.createElement('div', { className: 'mt-1' },
            Object.entries(component.attributes).map(([key, value]) => {
              // Skip attributes that are false or not meaningful
              if (value === false || value === 0) return null;

              return React.createElement('span',
                {
                  key: key,
                  className: 'tag tag-blue'
                },
                key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase()),
                typeof value === 'boolean' ? '' : `: ${value}`
              );
            })
          )
        );
      };

      const renderUseCaseInfo = (component) => {
        if (!component.useCaseInfo) return null;

        return React.createElement('div', { className: 'mt-2' },
          React.createElement('h4', { className: 'text-sm font-medium text-gray-700' }, 'Use Case Information:'),

          component.useCaseInfo.suitability ?
            React.createElement('div', { className: 'mt-1' },
              React.createElement('span', { className: 'font-medium' }, 'Suitable For:'),
              ' ' + component.useCaseInfo.suitability
            ) : null,

          component.useCaseInfo.complementaryComponents ?
            React.createElement('div', { className: 'mt-1' },
              React.createElement('span', { className: 'font-medium' }, 'Common Pairings:'),
              ' ' + component.useCaseInfo.complementaryComponents
            ) : null,

          component.useCaseInfo.customizationOptions ?
            React.createElement('div', { className: 'mt-1' },
              React.createElement('span', { className: 'font-medium' }, 'Customization Options:'),
              ' ' + component.useCaseInfo.customizationOptions
            ) : null
        );
      };

      const renderTemplateStructure = (structure) => {
        if (!structure) return null;

        const templateName = Object.keys(structure.structure)[0];
        const templateData = structure.structure[templateName];

        const renderNode = (node, path = '', depth = 0) => {
          if (typeof node === 'string') {
            // It's a file (either content or a path)
            if (node.startsWith('/assets/')) {
              // Asset reference
              return React.createElement('div', { key: path, style: { marginLeft: `${depth * 20}px` } },
                React.createElement('i', { className: 'fas fa-file-image text-blue-500 mr-2' }),
                React.createElement('a', { href: node, target: '_blank', className: 'text-blue-600 hover:underline' },
                  path.split('/').pop()
                )
              );
            } else if (path.endsWith('.html') || path.endsWith('.css') || path.endsWith('.js')) {
              // Code file
              return React.createElement('div', { key: path, style: { marginLeft: `${depth * 20}px` } },
                React.createElement('i', { className: `fas ${path.endsWith('.html') ? 'fa-file-code' : path.endsWith('.css') ? 'fa-file-alt' : 'fa-file-code'} text-gray-600 mr-2` }),
                React.createElement('span', { className: 'text-gray-800' }, path.split('/').pop())
              );
            } else {
              // Other file
              return React.createElement('div', { key: path, style: { marginLeft: `${depth * 20}px` } },
                React.createElement('i', { className: 'fas fa-file text-gray-500 mr-2' }),
                React.createElement('span', { className: 'text-gray-800' }, path.split('/').pop())
              );
            }
          } else {
            // It's a directory
            return React.createElement('div', { key: path },
              React.createElement('div', { style: { marginLeft: `${depth * 20}px` } },
                React.createElement('i', { className: 'fas fa-folder text-yellow-500 mr-2' }),
                React.createElement('span', { className: 'font-medium' }, path ? path.split('/').pop() : templateName)
              ),
              Object.entries(node).map(([key, value]) => {
                const newPath = path ? `${path}/${key}` : key;
                return renderNode(value, newPath, depth + 1);
              })
            );
          }
        };

        return React.createElement('div', { className: 'bg-white p-4 rounded-lg shadow-md' },
          React.createElement('h3', { className: 'text-lg font-medium text-gray-800 mb-4' }, 'Template Structure'),
          React.createElement('div', { className: 'overflow-y-auto max-h-96' },
            renderNode(templateData)
          )
        );
      };

      // Helper function for component preview
      const openComponentPreview = (component) => {
        const win = window.open('', '_blank');
        win.document.write(
          '<html>' +
          '<head>' +
          '<title>' + component.name + ' Preview</title>' +
          '<style>' + component.css + '</style>' +
          '</head>' +
          '<body>' +
          component.html +
          '</body>' +
          '</html>'
        );
        win.document.close();
      };

      // Helper function for website preview
      const openWebsitePreview = (website) => {
        const win = window.open('', '_blank');
        win.document.write(
          '<html>' +
          '<head>' +
          '<title>Generated Website Preview</title>' +
          '<style>' + website.css + '</style>' +
          '<meta name="viewport" content="width=device-width, initial-scale=1.0">' +
          '</head>' +
          '<body>' +
          website.html +
          '</body>' +
          '</html>'
        );
        win.document.close();
      };

      return React.createElement('div', { className: 'max-w-6xl mx-auto bg-white rounded-lg shadow overflow-hidden my-8' },
        // Header
        React.createElement('div', { className: 'bg-blue-600 p-4 text-white' },
          React.createElement('h1', { className: 'text-2xl font-bold' }, 'Template Vector Database Generator'),
          React.createElement('p', { className: 'text-blue-100' }, 'Upload and process website templates to build your vector database for RAG-enhanced generation')
        ),

        // Navigation Tabs
        React.createElement('div', { className: 'bg-gray-100 px-4 border-b' },
          React.createElement('nav', { className: 'flex flex-wrap' },
            React.createElement('button', {
              className: `px-4 py-3 font-medium ${activeTab === 'upload' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-600 hover:text-blue-600'}`,
              onClick: () => setActiveTab('upload')
            },
              React.createElement('i', { className: 'fas fa-upload mr-2' }),
              'Upload Templates'
            ),
            React.createElement('button', {
              className: `px-4 py-3 font-medium ${activeTab === 'processed' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-600 hover:text-blue-600'}`,
              onClick: () => {
                setActiveTab('processed');
                setSelectedTemplate(null);
                setTemplateComponents([]);
              }
            },
              React.createElement('i', { className: 'fas fa-search mr-2' }),
              'Processed Templates'
            ),
            React.createElement('button', {
              className: `px-4 py-3 font-medium ${activeTab === 'template-details' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-600 hover:text-blue-600'}`,
              onClick: () => setActiveTab('template-details'),
              disabled: !selectedTemplate
            },
              React.createElement('i', { className: 'fas fa-file-code mr-2' }),
              'Template Details'
            ),
            React.createElement('button', {
              className: `px-4 py-3 font-medium ${activeTab === 'database' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-600 hover:text-blue-600'}`,
              onClick: () => setActiveTab('database')
            },
              React.createElement('i', { className: 'fas fa-database mr-2' }),
              'Database Stats'
            ),
            React.createElement('button', {
              className: `px-4 py-3 font-medium ${activeTab === 'rag-generate' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-600 hover:text-blue-600'}`,
              onClick: () => setActiveTab('rag-generate')
            },
              React.createElement('i', { className: 'fas fa-magic mr-2' }),
              'Generate Website'
            )
          )
        ),

        // Content Area
        React.createElement('div', { className: 'p-6' },
          // Upload Templates Tab
          activeTab === 'upload' && React.createElement('div', null,
            React.createElement('div', { className: 'mb-6' },
              React.createElement('label', { className: 'block mb-2 font-medium text-gray-700' }, 'Upload Template ZIP Files'),
              React.createElement('div', { className: 'flex items-center justify-center w-full' },
                React.createElement('label', { className: 'flex flex-col items-center justify-center w-full h-64 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100' },
                  React.createElement('div', { className: 'flex flex-col items-center justify-center pt-5 pb-6' },
                    React.createElement('i', { className: 'fas fa-upload text-4xl mb-3 text-gray-400' }),
                    React.createElement('p', { className: 'mb-2 text-sm text-gray-500' },
                      React.createElement('span', { className: 'font-semibold' }, 'Click to upload'),
                      ' or drag and drop'
                    ),
                    React.createElement('p', { className: 'text-xs text-gray-500' }, 'ZIP files only (Max size: 50MB)')
                  ),
                  React.createElement('input', {
                    type: 'file',
                    accept: '.zip',
                    multiple: true,
                    className: 'hidden',
                    onChange: handleFileChange
                  })
                )
              )
            ),

            files.length > 0 && React.createElement('div', { className: 'mb-6' },
              React.createElement('h2', { className: 'text-lg font-medium text-gray-800 mb-4' }, 'Template Files'),
              React.createElement('div', { className: 'space-y-4' },
                files.map(file => React.createElement('div', { key: file.name, className: 'bg-gray-50 p-4 rounded-lg' },
                  React.createElement('div', { className: 'flex justify-between items-center mb-2' },
                    React.createElement('div', { className: 'flex items-center' },
                      React.createElement('div', { className: 'ml-3' },
                        React.createElement('p', { className: 'text-sm font-medium text-gray-900' }, file.name),
                        React.createElement('p', { className: 'text-sm text-gray-500' }, `${(file.size / 1024 / 1024).toFixed(2)} MB`)
                      )
                    ),
                    React.createElement('button', {
                      className: 'text-gray-400 hover:text-red-500',
                      onClick: () => removeFile(file.name),
                      disabled: processingStatus[file.name] && processingStatus[file.name] !== 'pending' && processingStatus[file.name] !== 'error'
                    },
                      React.createElement('i', { className: 'fas fa-times' })
                    )
                  ),

                  React.createElement('div', { className: 'w-full bg-gray-200 rounded-full h-2.5' },
                    React.createElement('div', {
                      className: `h-2.5 rounded-full ${processingStatus[file.name] === 'error' ? 'bg-red-600' : 'bg-blue-600'}`,
                      style: { width: `${uploadProgress[file.name]}%` }
                    })
                  ),

                  React.createElement('div', { className: 'mt-2 flex justify-between items-center' },
                    React.createElement('span', { className: 'text-xs font-medium text-gray-700' },
                      processingStatus[file.name] === 'pending'
                        ? 'Ready to upload'
                        : getStatusLabel(processingStatus[file.name])
                    ),
                    React.createElement('span', { className: 'text-xs font-medium text-gray-700' }, `${uploadProgress[file.name]}%`)
                  )
                ))
              ),

              React.createElement('div', { className: 'mt-6' },
                React.createElement('button', {
                  className: 'px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed',
                  onClick: handleUpload,
                  disabled: files.length === 0 || files.every(file => processingStatus[file.name] !== 'pending')
                }, 'Upload & Process All Files')
              )
            )
          ),

          // Processed Templates Tab
          activeTab === 'processed' && React.createElement('div', null,
            React.createElement('div', { className: 'flex flex-col md:flex-row justify-between items-start md:items-center mb-6 space-y-4 md:space-y-0' },
              React.createElement('h2', { className: 'text-lg font-medium text-gray-800' }, 'Processed Templates'),
              React.createElement('div', { className: 'flex flex-col md:flex-row space-y-2 md:space-y-0 md:space-x-4 w-full md:w-auto' },
                React.createElement('div', { className: 'relative' },
                  React.createElement('input', {
                    type: 'text',
                    placeholder: 'Search templates...',
